  <!-- Navbar -->
  <rect x="40" y="30" width="720" height="55" rx="8" fill="#FFFFFF" stroke="#2C3E50" stroke-width="8"/>
  <rect x="70" y="45" width="90" height="26" rx="4" fill="#2C3E50"/>
  
  <!-- Hero Headline -->
  <rect x="80" y="140" width="520" height="52" rx="8" fill="#2C3E50"/>
  
  <!-- Subheadline -->
