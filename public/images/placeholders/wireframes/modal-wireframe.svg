<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" fill="none">
  <!-- Backdrop -->
  <rect width="520" height="420" fill="#000000" fill-opacity="0.6"/>
  
  <!-- Modal container -->
  <rect x="60" y="80" width="400" height="260" rx="16" fill="#FAFAFA" stroke="#2C3E50" stroke-width="14"/>
  
  <!-- Modal header -->
  <rect x="80" y="100" width="360" height="50" fill="#F1F5F9" stroke="#2C3E50" stroke-width="8"/>
  <rect x="340" y="115" width="30" height="20" rx="4" fill="#EF4444"/>
  
  <!-- Modal content area -->
  <rect x="80" y="170" width="360" height="120" fill="#FAFAFA" stroke="#2C3E50" stroke-width="8" stroke-dasharray="6 4"/>
  
  <!-- Footer buttons -->
  <rect x="80" y="310" width="160" height="48" rx="10" fill="#E2E8F0" stroke="#2C3E50" stroke-width="8"/>
  <rect x="260" y="310" width="160" height="48" rx="10" fill="#3B82F6" stroke="#2C3E50" stroke-width="8"/>
</svg>