name: Fly Deploy

on:
  push:
    branches:
      - main

env:
  FLY_APP_NAME: puck-bem-atomic-nextjs

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly App if it doesn't exist
        run: |
          flyctl apps create ${{ env.FLY_APP_NAME }} --no-deploy || echo "App already exists or creation failed (continuing)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set primary region (optional)
        run: |
          flyctl regions set ord || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy app
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
