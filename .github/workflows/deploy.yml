name: Deploy to Fly.io

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/deploy@v1
        with:
          path: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
